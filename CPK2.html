<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CPK analysis w/photo function </title>
<style>
  :root {
    --bg: #faf9f6; --card: #ffffff; --text: #2a2a28; --text-sec: #6b6b66;
    --accent: #2a78d6; --accent2: #1baf7a; --danger: #e34948; --border: #e5e3dd;
    box-sizing: border-box; padding-top: env(safe-area-inset-top,0px); padding-bottom: env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#1b1b19; --card:#242422; --text:#eceae4; --text-sec:#a3a199; --border:#3a3a36; }
  }
  :root[data-theme="dark"] { --bg:#1b1b19; --card:#242422; --text:#eceae4; --text-sec:#a3a199; --border:#3a3a36; }
  html { scroll-padding-top: env(safe-area-inset-top,0px); }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; padding:16px; }
  h1 { font-size:18px; margin:4px 0 16px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:14px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  label { font-size:12px; color:var(--text-sec); display:block; margin-bottom:4px; }
  input[type=number], input[type=text] { width:100%; padding:8px 10px; border:1px solid var(--border); border-radius:8px; background:var(--bg); color:var(--text); font-size:14px; }
  .spec { flex:1; min-width:100px; }
  button { border:none; border-radius:8px; padding:10px 14px; font-size:14px; cursor:pointer; font-weight:600; }
  .btn-primary { background:var(--accent); color:#fff; }
  .btn-accent2 { background:var(--accent2); color:#fff; }
  .btn-ghost { background:transparent; color:var(--danger); padding:4px 8px; font-size:12px; }
  #status { font-size:13px; color:var(--text-sec); margin-top:8px; min-height:18px; }
  table { width:100%; border-collapse:collapse; margin-top:10px; font-size:13px; }
  th, td { text-align:center; padding:6px 4px; border-bottom:1px solid var(--border); }
  th { color:var(--text-sec); font-weight:500; }
  .stats { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
  @media (min-width:480px){ .stats{ grid-template-columns:repeat(4,1fr);} }
  .stat-box { background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:8px; text-align:center; }
  .stat-val { font-size:16px; font-weight:700; }
  .stat-lbl { font-size:11px; color:var(--text-sec); }
  .ppk-highlight { color:var(--accent2); }
  canvas { max-width:100%; }
  .list-wrap { max-height:220px; overflow-y:auto; }
  input[type=file] { display:none; }
  .near-item { display:flex; align-items:center; justify-content:space-between; gap:8px; background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:8px 10px; margin-bottom:6px; font-size:13px; }
  .near-item .val { font-weight:700; }
  .near-item .dist { color:var(--text-sec); font-size:11px; }
  .near-item.side-usl { border-left:3px solid var(--danger); }
  .near-item.side-lsl { border-left:3px solid var(--accent); }
  #undoBtn:disabled { opacity:0.4; cursor:not-allowed; }
</style>
</head>
<body>
<h1>📷 量測數據輸入 — 拍照自動辨識 + Ppk 分析</h1>

<div class="card">
  <div class="row">
    <div class="spec"><label>USL 規格上限</label><input type="number" id="usl" step="0.001" value="6.55"></div>
    <div class="spec"><label>LSL 規格下限</label><input type="number" id="lsl" step="0.001" value="6.45"></div>
  </div>
</div>

<div class="card">
  <div class="row">
    <button class="btn-primary" id="photoBtn">📷 拍照新增數值</button>
    <input type="file" id="fileInput" accept="image/*" capture="environment">
    <div class="spec" style="min-width:140px;">
      <input type="text" id="manualInput" placeholder="或手動輸入數值">
    </div>
    <button class="btn-accent2" id="addManualBtn">新增</button>
  </div>
  <div id="status"></div>
</div>

<div class="card">
  <div class="stats" id="statsBox"></div>
</div>

<div class="card">
  <div class="row" style="justify-content:space-between; align-items:center;">
    <label style="margin:0;">⚠️ 最接近規格界限的3個數值（可刪除觀察Cpk變化）</label>
    <button class="btn-accent2" id="undoBtn" disabled>↩️ 復原上一筆刪除</button>
  </div>
  <div id="nearLimitBox" style="margin-top:8px;"></div>
</div>

<div class="card">
  <canvas id="histCanvas" height="220"></canvas>
</div>

<div class="card">
  <div class="list-wrap">
    <table id="dataTable">
      <thead><tr><th>#</th><th>數值</th><th></th></tr></thead>
      <tbody id="dataBody"></tbody>
    </table>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
let values = [6.542,6.532,6.531,6.535,6.537,6.540,6.535,6.531,6.539,6.530,
6.537,6.531,6.530,6.531,6.540,6.537,6.533,6.537,6.532,6.534,
6.531,6.523,6.530,6.531,6.534,6.532,6.534,6.530,6.537,6.533];

let sample = null;
let sampleImagesOk = false;
(async () => {
  try {
    sample = await claude.use('sample');
    if (sample) {
      const lim = await sample.limits();
      sampleImagesOk = !!lim.images;
    }
  } catch (e) { /* unavailable */ }
  if (!sample) document.getElementById('status').textContent = '（拍照辨識目前無法使用，請用手動輸入）';
})();

const statusEl = document.getElementById('status');
const fileInput = document.getElementById('fileInput');
document.getElementById('photoBtn').addEventListener('click', () => fileInput.click());

fileInput.addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  if (!sample || !sampleImagesOk) { statusEl.textContent = '拍照辨識無法使用，請改用手動輸入'; fileInput.value=''; return; }
  statusEl.textContent = '辨識中…';
  try {
    const result = await sample(
      '圖片中顯示一個量測讀數（例如卡尺、量錶或顯示幕上的數字）。只回傳該數值本身，純數字可含小數點，不要任何文字、單位或其他符號。',
      { images: [file] }
    );
    const m = (result.text || '').match(/-?\d+(\.\d+)?/);
    if (m) {
      addValue(parseFloat(m[0]));
      statusEl.textContent = `已新增：${m[0]}`;
    } else {
      statusEl.textContent = '無法辨識出數字，請手動輸入';
    }
  } catch (err) {
    statusEl.textContent = '辨識失敗：' + (err.code || err.message || '未知錯誤');
  }
  fileInput.value = '';
});

document.getElementById('addManualBtn').addEventListener('click', () => {
  const inp = document.getElementById('manualInput');
  const v = parseFloat(inp.value);
  if (!isNaN(v)) { addValue(v); inp.value=''; statusEl.textContent = `已新增：${v}`; }
});

let undoStack = [];

function addValue(v) {
  values.push(v);
  render();
}
function removeValue(i) {
  undoStack.push(values[i]);
  values.splice(i,1);
  render();
}
function undoDelete() {
  const v = undoStack.pop();
  if (v !== undefined) { values.push(v); render(); }
}
document.getElementById('undoBtn').addEventListener('click', undoDelete);

function mean(arr){ return arr.reduce((a,b)=>a+b,0)/arr.length; }
function stdev(arr){
  const m = mean(arr);
  const v = arr.reduce((s,x)=>s+(x-m)*(x-m),0)/(arr.length-1);
  return Math.sqrt(v);
}

let chart = null;
function render() {
  const body = document.getElementById('dataBody');
  body.innerHTML = '';
  values.forEach((v,i) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${i+1}</td><td>${v}</td><td><button class="btn-ghost" onclick="removeValue(${i})">刪除</button></td>`;
    body.appendChild(tr);
  });

  const statsBox = document.getElementById('statsBox');
  const usl = parseFloat(document.getElementById('usl').value);
  const lsl = parseFloat(document.getElementById('lsl').value);
  let m=0, s=0, ppk=null, ppu=null, ppl=null;
  if (values.length >= 2) {
    m = mean(values); s = stdev(values);
    if (s > 0 && !isNaN(usl) && !isNaN(lsl)) {
      ppu = (usl - m)/(3*s); ppl = (m - lsl)/(3*s); ppk = Math.min(ppu, ppl);
    }
  }
  statsBox.innerHTML = `
    <div class="stat-box"><div class="stat-val">${values.length}</div><div class="stat-lbl">樣本數 n</div></div>
    <div class="stat-box"><div class="stat-val">${values.length?m.toFixed(4):'-'}</div><div class="stat-lbl">平均值</div></div>
    <div class="stat-box"><div class="stat-val">${values.length>=2?s.toFixed(5):'-'}</div><div class="stat-lbl">標準差</div></div>
    <div class="stat-box"><div class="stat-val ppk-highlight">${ppk!==null?ppk.toFixed(3):'-'}</div><div class="stat-lbl">Cpk</div></div>
  `;

  renderNearLimit(usl, lsl);
  document.getElementById('undoBtn').disabled = undoStack.length === 0;
  drawHistogram();
}

function renderNearLimit(usl, lsl) {
  const box = document.getElementById('nearLimitBox');
  box.innerHTML = '';
  if (values.length === 0 || isNaN(usl) || isNaN(lsl)) { box.innerHTML = '<div class="stat-lbl">（目前無數據）</div>'; return; }

  const withDist = values.map((v,i) => {
    const distUsl = usl - v;
    const distLsl = v - lsl;
    const side = distUsl <= distLsl ? 'usl' : 'lsl';
    const dist = Math.min(distUsl, distLsl);
    return { v, i, dist, side };
  }).sort((a,b) => a.dist - b.dist).slice(0,3);

  withDist.forEach(item => {
    const div = document.createElement('div');
    div.className = 'near-item side-' + item.side;
    div.innerHTML = `
      <div>
        <div class="val">${item.v}</div>
        <div class="dist">距${item.side==='usl'?'USL':'LSL'} ${item.dist.toFixed(4)}</div>
      </div>
      <button class="btn-ghost" onclick="removeValue(${item.i})">刪除</button>
    `;
    box.appendChild(div);
  });
}

document.getElementById('usl').addEventListener('input', render);
document.getElementById('lsl').addEventListener('input', render);

function drawHistogram() {
  const ctx = document.getElementById('histCanvas');
  if (values.length < 1) { if (chart) { chart.destroy(); chart = null; } return; }

  const counts = {};
  values.forEach(v => { counts[v] = (counts[v] || 0) + 1; });
  const uniqueVals = Object.keys(counts).map(Number).sort((a,b) => a-b);
  const labels = uniqueVals.map(v => v.toString());
  const bins = uniqueVals.map(v => counts[v]);

  if (chart) chart.destroy();
  chart = new Chart(ctx, {
    type: 'bar',
    data: { labels, datasets: [{ label:'次數', data:bins, backgroundColor:'#2a78d6', borderRadius:3 }] },
    options: {
      responsive: true,
      plugins: { legend: { display:false }, title:{ display:true, text:'數值分佈（每一筆數值）' } },
      scales: {
        x: { title:{ display:true, text:'量測值' } },
        y: { title:{ display:true, text:'次數' }, ticks:{ stepSize:1 } }
      }
    }
  });
}

render();
</script>
</body>
</html>
