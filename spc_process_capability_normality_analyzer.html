    // Standard Normal CDF (Abramowitz & Stegun formula 26.2.17)
    function normalCDF(x) {
      const p = 0.2316419;
      const b1 = 0.319381530;
      const b2 = -0.356563782;
      const b3 = 1.781477937;
      const b4 = -1.821255978;
      const b5 = 1.330274429;
      
      const absX = Math.abs(x);
      const t = 1.0 / (1.0 + p * absX);
      const y = 1.0 - (1.0 / Math.sqrt(2 * Math.PI)) * Math.exp(-0.5 * absX * absX) * 
                (b1 * t + b2 * Math.pow(t, 2) + b3 * Math.pow(t, 3) + b4 * Math.pow(t, 4) + b5 * Math.pow(t, 5));
      
      return x >= 0 ? y : 1.0 - y;
    }

    // Inverse Standard Normal CDF (Quantile function)
    function normalQuantile(p) {
      if (p <= 0 || p >= 1) return NaN;
      
      const c0 = 2.515517;
      const c1 = 0.802853;
      const c2 = 0.010328;
      const d1 = 1.432788;
      const d2 = 0.189269;
      const d3 = 0.001308;
      
      let t = p < 0.5 ? Math.sqrt(-2.0 * Math.log(p)) : Math.sqrt(-2.0 * Math.log(1.0 - p));
      let num = c0 + t * (c1 + t * c2);
      let den = 1.0 + t * (d1 + t * (d2 + t * d3));
      let q = t - num / den;
      
      return p < 0.5 ? -q : q;
    }

    // Normal Probability Density Function (PDF)
    function normalPDF(x, mean, std) {
      if (std <= 0) return 0;
      const exponent = -Math.pow(x - mean, 2) / (2 * Math.pow(std, 2));
      return (1 / (std * Math.sqrt(2 * Math.PI))) * Math.exp(exponent);
    }

    // Calculate all descriptive, Anderson-Darling, and capability stats
    function computeStatistics(data, LSL, USL) {
      const n = data.length;
      if (n < 3) {
        return { error: "At least 3 data points are required for statistical analysis." };
      }

      const sorted = [...data].sort((a, b) => a - b);
      const sum = data.reduce((a, b) => a + b, 0);
      const mean = sum / n;
      
      const min = sorted[0];
      const max = sorted[n - 1];
      const range = max - min;
      
      const sqDiffSum = data.reduce((acc, val) => acc + Math.pow(val - mean, 2), 0);
      const variance = sqDiffSum / (n - 1);
      const stdDev = Math.sqrt(variance);
      
      const popVariance = sqDiffSum / n;
      const popStdDev = Math.sqrt(popVariance);

      if (stdDev === 0) {
        return { error: "Standard deviation is 0. All data points are identical. Process metrics are undefined." };
      }

      const getPercentile = (p) => {
        const idx = (p / 100) * (n - 1);
        const low = Math.floor(idx);
        const high = Math.ceil(idx);
        const weight = idx - low;
        return sorted[low] * (1 - weight) + sorted[high] * weight;
      };
      
      const q1 = getPercentile(25);
      const median = getPercentile(50);
      const q3 = getPercentile(75);
      const iqr = q3 - q1;

      // Skewness & Kurtosis
      const m3 = data.reduce((acc, val) => acc + Math.pow(val - mean, 3), 0) / n;
      const m2 = sqDiffSum / n;
      const biasedSkew = m3 / Math.pow(m2, 1.5);
      const skewness = (Math.sqrt(n * (n - 1)) / (n - 2)) * biasedSkew;
      
      const m4 = data.reduce((acc, val) => acc + Math.pow(val - mean, 4), 0) / n;
      const biasedKurt = (m4 / Math.pow(m2, 2)) - 3;
      const kurtosis = ((n - 1) / ((n - 2) * (n - 3))) * ((n + 1) * biasedKurt + 6);

      const ses = Math.sqrt((6 * n * (n - 1)) / ((n - 2) * (n + 1) * (n + 3)));
      const sek = 2 * ses * Math.sqrt((Math.pow(n, 2) - 1) / ((n - 3) * (n + 5)));

      // Anderson-Darling Test
      let sumAD = 0;
      for (let i = 0; i < n; i++) {
        const idx1 = i + 1;
        const idx2 = n - i;
        
        const z1 = (sorted[i] - mean) / stdDev;
        const z2 = (sorted[idx2 - 1] - mean) / stdDev;
        
        const p1 = Math.max(1e-15, Math.min(1 - 1e-15, normalCDF(z1)));
        const p2 = Math.max(1e-15, Math.min(1 - 1e-15, normalCDF(z2)));
        
        sumAD += (2 * idx1 - 1) * (Math.log(p1) + Math.log(1.0 - p2));
      }
      const adStat = -n - (sumAD / n);
      const adStatAdj = adStat * (1.0 + 0.75 / n + 2.25 / (n * n));

      let adPValue = 0;
      if (adStatAdj >= 0.60) {
        adPValue = Math.exp(1.2937 - 5.709 * adStatAdj + 0.0186 * Math.pow(adStatAdj, 2));
      } else if (adStatAdj > 0.34) {
        adPValue = Math.exp(0.9177 - 4.279 * adStatAdj - 1.38 * Math.pow(adStatAdj, 2));
      } else if (adStatAdj > 0.20) {
        adPValue = 1.0 - Math.exp(-8.318 + 42.796 * adStatAdj - 59.938 * Math.pow(adStatAdj, 2));
      } else {
        adPValue = 1.0 - Math.exp(-13.436 + 101.14 * adStatAdj - 223.73 * Math.pow(adStatAdj, 2));
      }
      adPValue = Math.max(0, Math.min(1, adPValue));

      // Capabilities
      const specRange = USL - LSL;
      const Cp = specRange / (6 * stdDev);
      const Cpu = (USL - mean) / (3 * stdDev);
      const Cpl = (mean - LSL) / (3 * stdDev);
      const Cpk = Math.min(Cpu, Cpl);
      
      const target = (USL + LSL) / 2;
      const k = Math.abs(mean - target) / (specRange / 2);

      const zLsl = (LSL - mean) / stdDev;
      const zUsl = (USL - mean) / stdDev;
      
      const fractionBelowLsl = normalCDF(zLsl);
      const fractionAboveUsl = 1.0 - normalCDF(zUsl);
      const totalFractionOos = fractionBelowLsl + fractionAboveUsl;

      const ppmBelowLsl = Math.round(fractionBelowLsl * 1000000);
      const ppmAboveUsl = Math.round(fractionAboveUsl * 1000000);
      const totalPpm = ppmBelowLsl + ppmAboveUsl;

      let normalityVerdict = adPValue < 0.05 
        ? "Non-Normal (Reject Normality H₀ at α = 0.05)" 
        : "Normal (Fail to reject Normality H₀ at α = 0.05)";

      return {
        n, mean, stdDev, popStdDev, variance, min, max, range, q1, median, q3, iqr,
        skewness, kurtosis, ses, sek, adStat, adStatAdj, adPValue, normalityVerdict,
        Cp, Cpu, Cpl, Cpk, k, target, zLsl, zUsl,
        ppmBelowLsl, ppmAboveUsl, totalPpm, fractionBelowLsl, fractionAboveUsl
      };
    }

    const RAW_MEASUREMENTS = [
      6.542, 6.532, 6.531, 6.535, 6.537, 6.540, 6.535, 6.531, 6.539, 6.530,
      6.537, 6.531, 6.530, 6.531, 6.540, 6.537, 6.533, 6.537, 6.532, 6.534,
      6.531, 6.523, 6.530, 6.531, 6.534, 6.532, 6.534, 6.530, 6.537, 6.533
    ];

    function App() {
      const [sampleCount, setSampleCount] = useState(30);
      const [rawText, setRawText] = useState(RAW_MEASUREMENTS.join(', '));
      const [lslInput, setLslInput] = useState('6.45');
      const [uslInput, setUslInput] = useState('6.55');
      const [binCount, setBinCount] = useState(10);
      const [activeTab, setActiveTab] = useState('report');
      const [toastMessage, setToastMessage] = useState('');
      
      const [hoveredBin, setHoveredBin] = useState(null);
      const [hoveredPoint, setHoveredPoint] = useState(null);

      const currentData = useMemo(() => {
        const cleaned = rawText
          .replace(/[\[\]]/g, '')
          .split(/[\s,;\n\t]+/)
          .map(x => parseFloat(x))
          .filter(x => !isNaN(x));
        return cleaned;
      }, [rawText]);

      const LSL = parseFloat(lslInput) || 0;
      const USL = parseFloat(uslInput) || 0;

      const statsResult = useMemo(() => {
        return computeStatistics(currentData, LSL, USL);
      }, [currentData, LSL, USL]);

      const handleSampleCountChange = (count) => {
        const parsed = parseInt(count);
        const num = isNaN(parsed) ? 3 : Math.max(3, Math.min(RAW_MEASUREMENTS.length, parsed));
        setSampleCount(num);
        setRawText(RAW_MEASUREMENTS.slice(0, num).join(', '));
      };

      const handleResetData = () => {
        setSampleCount(30);
        setRawText(RAW_MEASUREMENTS.join(', '));
        setLslInput('6.45');
        setUslInput('6.55');
      };

      const handleDataTextChange = (text) => {
        setRawText(text);
      };

      const getCpkBadgeDetails = (cpk) => {
        if (isNaN(cpk) || !isFinite(cpk)) return { label: "N/A", color: "bg-slate-700 text-slate-300", border: "border-slate-600", desc: "No specification data." };
        if (cpk >= 1.67) return { label: "Six Sigma Class (Outstanding)", color: "bg-emerald-500/20 text-emerald-300 border-emerald-500/40", border: "border-emerald-500/30", desc: "Process is highly capable, extremely low defects rate." };
        if (cpk >= 1.33) return { label: "Capable (Industrial Standard)", color: "bg-cyan-500/20 text-cyan-300 border-cyan-500/40", border: "border-cyan-500/30", desc: "Satisfies common manufacturing standards." };
        if (cpk >= 1.00) return { label: "Marginal", color: "bg-amber-500/20 text-amber-300 border-amber-500/40", border: "border-amber-500/30", desc: "Process is barely capable. Requires active monitoring." };
        return { label: "Inadequate (High Defect Risk)", color: "bg-rose-500/20 text-rose-300 border-rose-500/40", border: "border-rose-500/30", desc: "Process is generating (or highly likely to generate) out-of-spec products." };
      };

      const cpkRating = getCpkBadgeDetails(statsResult.Cpk);

      const handleCopyReport = () => {
        if (statsResult.error) return;
        const reportText = `
### PROCESS CAPABILITY & NORMALITY REPORT
========================================
[Sample Size (n)]     : ${statsResult.n}
[Mean]                : ${statsResult.mean.toFixed(6)}
[Std Deviation]       : ${statsResult.stdDev.toFixed(6)}
[Specification Limits]: LSL = ${LSL}, USL = ${USL}

NORMALITY ASSESSMENT (Anderson-Darling)
-------------------------
[AD Stat (A²)]        : ${statsResult.adStat.toFixed(4)}
[AD Adjusted (A*²)]   : ${statsResult.adStatAdj.toFixed(4)}
[P-value (Normality)] : ${statsResult.adPValue.toFixed(6)}
[Verdict]             : ${statsResult.normalityVerdict}

PROCESS CAPABILITY INDEX
-------------------------
[Cp]                  : ${statsResult.Cp ? statsResult.Cp.toFixed(4) : 'N/A'}
[Cpk]                 : ${statsResult.Cpk ? statsResult.Cpk.toFixed(4) : 'N/A'}
[Cpu / Cpl]           : ${statsResult.Cpu ? statsResult.Cpu.toFixed(4) : 'N/A'} / ${statsResult.Cpl ? statsResult.Cpl.toFixed(4) : 'N/A'}

DEFECT RATE ESTIMATES (PPM)
-------------------------
[Total PPM Defective] : ${statsResult.totalPpm}
========================================
Generated on SPC-Pro Diagnostic Analyzer
        `;
        
        // Execute fallback clipboard copy for browser security contexts
        const textarea = document.createElement("textarea");
        textarea.value = reportText.trim();
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand("copy");
        document.body.removeChild(textarea);

        setToastMessage("Report copied to clipboard!");
        setTimeout(() => setToastMessage(''), 3000);
      };

      const histogramChart = useMemo(() => {
        if (statsResult.error || currentData.length === 0) return null;

        const dataMin = statsResult.min;
        const dataMax = statsResult.max;
        
        const minX = Math.min(LSL, dataMin) - (statsResult.stdDev * 1.5);
        const maxX = Math.max(USL, dataMax) + (statsResult.stdDev * 1.5);
        const xRange = maxX - minX;

        const width = 550;
        const height = 300;
        const paddingLeft = 55;
        const paddingRight = 40;
        const paddingTop = 45;
        const paddingBottom = 40;

        const plotWidth = width - paddingLeft - paddingRight;
        const plotHeight = height - paddingTop - paddingBottom;

        const scaleX = (val) => paddingLeft + ((val - minX) / xRange) * plotWidth;

        const widthOfBin = (dataMax - dataMin) / binCount;
        const bins = Array.from({ length: binCount }, (_, i) => {
          const start = dataMin + i * widthOfBin;
          const end = start + widthOfBin;
          return { start, end, count: 0, density: 0 };
        });

        currentData.forEach(val => {
          let bIdx = Math.floor((val - dataMin) / widthOfBin);
          if (bIdx >= binCount) bIdx = binCount - 1;
          if (bIdx < 0) bIdx = 0;
          bins[bIdx].count++;
        });

        bins.forEach(b => {
          b.density = b.count / (currentData.length * widthOfBin);
        });

        const maxNormalPdfDensity = normalPDF(statsResult.mean, statsResult.mean, statsResult.stdDev);
        const maxBarDensity = Math.max(...bins.map(b => b.density));
        const maxY = Math.max(maxNormalPdfDensity, maxBarDensity) * 1.15;

        const scaleY = (val) => paddingTop + plotHeight - (val / maxY) * plotHeight;

        const curvePointsCount = 120;
        const curvePoints = [];
        for (let i = 0; i <= curvePointsCount; i++) {
          const curX = minX + (i / curvePointsCount) * xRange;
          const curY = normalPDF(curX, statsResult.mean, statsResult.stdDev);
          curvePoints.push({ x: scaleX(curX), y: scaleY(curY) });
        }

        let curveDPath = "";
        if (curvePoints.length > 0) {
          curveDPath = `M ${curvePoints[0].x} ${curvePoints[0].y} ` + 
            curvePoints.slice(1).map(pt => `L ${pt.x} ${pt.y}`).join(" ");
        }

        return {
          width, height, paddingLeft, paddingRight, paddingTop, paddingBottom,
          plotWidth, plotHeight, bins, curveDPath, scaleX, scaleY, minX, maxX, maxY,
          dataMin, dataMax, widthOfBin
        };
      }, [currentData, statsResult, LSL, USL, binCount]);

      const qqChart = useMemo(() => {
        if (statsResult.error || currentData.length === 0) return null;

        const sorted = [...currentData].sort((a, b) => a - b);
        const n = sorted.length;

        const points = sorted.map((val, idx) => {
          const i = idx + 1;
          const p = (i - 0.375) / (n + 0.25);
          const theoreticalQ = normalQuantile(p);
          return { q: theoreticalQ, val: val, idx: i };
        });

        const xq1 = normalQuantile(0.25);
        const xq3 = normalQuantile(0.75);
        const yq1 = statsResult.q1;
        const yq3 = statsResult.q3;

        const slope = (xq3 - xq1) / (yq3 - yq1);
        const intercept = xq1 - slope * yq1;

        const qMinX = statsResult.min - (statsResult.stdDev * 1.0);
        const qMaxX = statsResult.max + (statsResult.stdDev * 1.0);
        const qRangeX = qMaxX - qMinX;

        const qMinY = -3.2;
        const qMaxY = 3.2;
        const qRangeY = qMaxY - qMinY;

        const width = 550;
        const height = 300;
        const paddingLeft = 55;
        const paddingRight = 40;
        const paddingTop = 45;
        const paddingBottom = 40;

        const plotWidth = width - paddingLeft - paddingRight;
        const plotHeight = height - paddingTop - paddingBottom;

        const scaleQX = (val) => paddingLeft + ((val - qMinX) / qRangeX) * plotWidth;
        const scaleQY = (val) => paddingTop + plotHeight - ((val - qMinY) / qRangeY) * plotHeight;

        const x1_line = qMinX;
        const y1_line = slope * qMinX + intercept;
        const x2_line = qMaxX;
        const y2_line = slope * qMaxX + intercept;

        return {
          width, height, paddingLeft, paddingRight, paddingTop, paddingBottom,
          plotWidth, plotHeight, points, scaleQX, scaleQY, qMinX, qMaxX, qMinY, qMaxY,
          refLine: {
            x1: scaleQX(x1_line),
            y1: scaleQY(y1_line),
            x2: scaleQX(x2_line),
            y2: scaleQY(y2_line)
          }
        };

                                  className="transition-all duration-150 cursor-crosshair"
                                  onMouseEnter={() => setHoveredPoint(i)}
                                  onMouseLeave={() => setHoveredPoint(null)}
                                />
                              );
                            })}

                            <line
                              x1={qqChart.paddingLeft}
                              y1={qqChart.height - qqChart.paddingBottom}
                              x2={qqChart.width - qqChart.paddingRight}
                              y2={qqChart.height - qqChart.paddingBottom}
                              stroke="#475569"
                              strokeWidth="1"
                            />
                            <line
                              x1={qqChart.paddingLeft}
                              y1={qqChart.paddingTop}
                              x2={qqChart.paddingLeft}
                              y2={qqChart.height - qqChart.paddingBottom}
                              stroke="#475569"
                              strokeWidth="1"
                            />

                            {[0, 0.25, 0.5, 0.75, 1.0].map((ratio, i) => {
                              const xVal = qqChart.qMinX + ratio * (qqChart.qMaxX - qqChart.qMinX);
                              const mappedX = qqChart.scaleQX(xVal);
                              return (
                                <g key={i}>
                                  <line x1={mappedX} y1={qqChart.height - qqChart.paddingBottom} x2={mappedX} y2={qqChart.height - qqChart.paddingBottom + 4} stroke="#475569" />
                                  <text
                                    x={mappedX}
                                    y={qqChart.height - qqChart.paddingBottom + 14}
                                    fill="#94a3b8"
                                    fontSize="8.5"
                                    textAnchor="middle"
                                    fontWeight="600"
                                  >
                                    {xVal.toFixed(3)}
                                  </text>
                                </g>
                              );
                            })}

                            {[-3, -2, -1, 0, 1, 2, 3].map((q, i) => {
                              const mappedY = qqChart.scaleQY(q);
                              return (
                                <g key={i}>
                                  <line x1={qqChart.paddingLeft - 4} y1={mappedY} x2={qqChart.paddingLeft} y2={mappedY} stroke="#475569" />
                                  <text
                                    x={qqChart.paddingLeft - 8}
                                    y={mappedY + 3}
                                    fill="#94a3b8"
                                    fontSize="8.5"
                                    textAnchor="end"
                                    fontWeight="600"
                                  >
                                    {q}
                                  </text>
                                </g>
                              );
                            })}

                            <text
                              x={qqChart.paddingLeft + qqChart.plotWidth / 2}
                              y={qqChart.height - 4}
                              fill="#64748b"
                              fontSize="8"
                              textAnchor="middle"
                              fontWeight="bold"
                              className="tracking-wider uppercase"
                            >
                              Observed Value (測量數據觀察值)
                            </text>

                            <text
                              transform={`rotate(-90 ${qqChart.paddingLeft - 38} ${(qqChart.height)/2})`}
                              x={qqChart.paddingLeft - 38}
                              y={(qqChart.height)/2}
                              fill="#64748b"
                              fontSize="8"
                              textAnchor="middle"
                              fontWeight="bold"
                              className="tracking-wider uppercase"
                            >
                              Theoretical Quantile
                            </text>
                          </svg>
                        )}

                        <div className="h-6 mt-1 flex justify-center">
                          {hoveredPoint !== null && qqChart && (
                            <div className="text-[10px] bg-slate-800 border border-slate-700/60 px-3 py-1 rounded-full text-slate-300 font-mono flex items-center gap-2">
                              <span className="font-bold text-emerald-400">Point #{qqChart.points[hoveredPoint].idx}:</span>
                              <span>Observed: <strong className="text-white">{qqChart.points[hoveredPoint].val.toFixed(4)}</strong></span>
                              <span>|</span>
                              <span>Quantile: <strong className="text-white">{qqChart.points[hoveredPoint].q.toFixed(3)}</strong></span>
                            </div>
                          )}
                        </div>
                      </div>
                    </div>

                  </div>

                  {/* DETAILS TABS */}
                  <div className="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-sm">
                    <div className="flex border-b border-slate-800 bg-slate-950/40">
                      <button
                        onClick={() => setActiveTab('report')}
                        className={`flex items-center gap-1.5 px-5 py-3.5 text-xs font-bold border-b-2 transition-all ${
                          activeTab === 'report'
                            ? 'border-indigo-500 text-indigo-400 bg-slate-900/50'
                            : 'border-transparent text-slate-400 hover:text-slate-200'
                        }`}
                      >
                        <FileText className="w-3.5 h-3.5" />
                        SPC Diagnostics Report
                      </button>
                      <button
                        onClick={() => setActiveTab('descriptive')}
                        className={`flex items-center gap-1.5 px-5 py-3.5 text-xs font-bold border-b-2 transition-all ${
                          activeTab === 'descriptive'
                            ? 'border-indigo-500 text-indigo-400 bg-slate-900/50'
                            : 'border-transparent text-slate-400 hover:text-slate-200'
                        }`}
                      >
                        <Sliders className="w-3.5 h-3.5" />
                        Descriptive Statistics
                      </button>
                      <button
                        onClick={() => setActiveTab('raw')}
                        className={`flex items-center gap-1.5 px-5 py-3.5 text-xs font-bold border-b-2 transition-all ${
                          activeTab === 'raw'
                            ? 'border-indigo-500 text-indigo-400 bg-slate-900/50'
                            : 'border-transparent text-slate-400 hover:text-slate-200'
                        }`}
                      >
                        <Database className="w-3.5 h-3.5" />
                        Z-Scores & Percentiles
                      </button>
                    </div>

                    {activeTab === 'report' && (
                      <div className="p-6 space-y-6">
                        <div className="grid grid-cols-1 md:grid-cols-12 gap-6 items-center">
                          <div className="md:col-span-4 bg-slate-950/50 rounded-xl p-4 border border-slate-800/80 text-center">
                            <span className="text-[10px] text-slate-500 font-bold tracking-wider uppercase block">Estimated Defective rate</span>
                            <div className="text-3xl font-extrabold font-mono text-indigo-300 mt-2">
                              {statsResult.totalPpm.toLocaleString()} <span className="text-xs font-semibold text-slate-500 font-sans">PPM</span>
                            </div>
                            <p className="text-[10px] text-slate-400 mt-1.5 font-sans leading-relaxed">
                              Estimated out-of-spec products per million batches processed.
                            </p>
                          </div>

                          <div className="md:col-span-8 space-y-3">
                            <div className="flex justify-between text-xs">
                              <span className="text-amber-400 font-bold">Estimated Below LSL (&lt; {LSL}):</span>
                              <span className="font-mono text-slate-200">{statsResult.ppmBelowLsl.toLocaleString()} PPM ({ (statsResult.fractionBelowLsl * 100).toFixed(4) }%)</span>
                            </div>
                            <div className="w-full bg-slate-950 rounded-full h-2">
                              <div 
                                className="bg-amber-500 h-2 rounded-full transition-all"
                                style={{ width: `${Math.min(100, statsResult.fractionBelowLsl * 10000)}%` }}
                              />
                            </div>

                            <div className="flex justify-between text-xs mt-3">
                              <span className="text-fuchsia-400 font-bold">Estimated Above USL (&gt; {USL}):</span>
                              <span className="font-mono text-slate-200">{statsResult.ppmAboveUsl.toLocaleString()} PPM ({ (statsResult.fractionAboveUsl * 100).toFixed(4) }%)</span>
                            </div>
                            <div className="w-full bg-slate-950 rounded-full h-2">
                              <div 
                                className="bg-fuchsia-500 h-2 rounded-full transition-all"
                                style={{ width: `${Math.min(100, statsResult.fractionAboveUsl * 10000)}%` }}
                              />
                            </div>
                          </div>
                        </div>

                        <div className={`border-l-4 p-4.5 rounded-r-xl ${cpkRating.border} bg-slate-950/40 space-y-2`}>
                          <div className="flex items-center gap-2">
                            <Info className="w-4.5 h-4.5 text-indigo-400 shrink-0" />
                            <h4 className="text-xs font-bold text-slate-200">Process Capability Assessment & Actions</h4>
                          </div>
                          <p className="text-xs text-slate-300 leading-relaxed font-sans">
                            Your process has a calculated potential capability of <strong className="text-indigo-300 font-mono">Cp = {statsResult.Cp.toFixed(3)}</strong>, and actual capability of <strong className="text-indigo-300 font-mono">Cpk = {statsResult.Cpk.toFixed(3)}</strong>. 
                            {statsResult.Cpk < statsResult.Cp ? (
                              <span> There is a notable centering bias of <strong className="text-amber-400 font-mono">k = {(statsResult.k * 100).toFixed(1)}%</strong> offset from target. Correcting the process centering towards target {(statsResult.target).toFixed(4)} will improve your Cpk value towards {statsResult.Cp.toFixed(3)} and reduce defects.</span>
                            ) : (
                              <span> The process is beautifully centered on target, and your actual process performance matches its optimal potential.</span>
                            )}
                          </p>
                          <p className="text-[11px] text-slate-400 font-sans leading-relaxed">
                            <strong>Quality Grade verdict:</strong> {cpkRating.desc}
                          </p>
                        </div>

                      </div>
                    )}

                    {activeTab === 'descriptive' && (
                      <div className="p-6 grid grid-cols-1 md:grid-cols-2 gap-x-12 gap-y-4">
                        <div className="space-y-3">
                          <h4 className="text-xs font-bold text-slate-400 border-b border-slate-800 pb-1 uppercase tracking-wider">Central Tendency & Variance</h4>
                          <div className="flex justify-between text-xs py-1">
                            <span className="text-slate-400">Total Sample Count (n)</span>
                            <span className="font-mono font-bold text-slate-200">{statsResult.n}</span>
                          </div>
                          <div className="flex justify-between text-xs py-1">
                            <span className="text-slate-400">Mean (Process Average)</span>
                            <span className="font-mono font-bold text-slate-200">{statsResult.mean.toFixed(6)}</span>
                          </div>
                          <div className="flex justify-between text-xs py-1">
                            <span className="text-slate-400">Sample Variance (s²)</span>
                            <span className="font-mono font-bold text-slate-200">{statsResult.variance.toFixed(8)}</span>
                          </div>
                          <div className="flex justify-between text-xs py-1">
                            <span className="text-slate-400">Sample Std Dev (s)</span>
                            <span className="font-mono font-bold text-slate-200">{statsResult.stdDev.toFixed(6)}</span>
                          </div>
                          <div className="flex justify-between text-xs py-1">
                            <span className="text-slate-400">Population Std Dev (σ)</span>
                            <span className="font-mono font-bold text-slate-200">{statsResult.popStdDev.toFixed(6)}</span>
                          </div>
                        </div>

                        <div className="space-y-3">
                          <h4 className="text-xs font-bold text-slate-400 border-b border-slate-800 pb-1 uppercase tracking-wider">Quartiles & Distribution Shape</h4>
                          <div className="flex justify-between text-xs py-1">
                            <span className="text-slate-400">Minimum Value</span>
                            <span className="font-mono font-bold text-slate-200">{statsResult.min.toFixed(4)}</span>
                          </div>
                          <div className="flex justify-between text-xs py-1">
                            <span className="text-slate-400">Lower Quartile (Q1)</span>
                            <span className="font-mono font-bold text-slate-200">{statsResult.q1.toFixed(4)}</span>
                          </div>
                          <div className="flex justify-between text-xs py-1">
                            <span className="text-slate-400">Median (Q2)</span>
                            <span className="font-mono font-bold text-slate-200">{statsResult.median.toFixed(4)}</span>
                          </div>
                          <div className="flex justify-between text-xs py-1">
                            <span className="text-slate-400">Upper Quartile (Q3)</span>
                            <span className="font-mono font-bold text-slate-200">{statsResult.q3.toFixed(4)}</span>
                          </div>
                          <div className="flex justify-between text-xs py-1">
                            <span className="text-slate-400">Maximum Value</span>
                            <span className="font-mono font-bold text-slate-200">{statsResult.max.toFixed(4)}</span>
                          </div>
                        </div>

                        <div className="space-y-3 md:col-span-2 pt-4 border-t border-slate-800">
                          <h4 className="text-xs font-bold text-slate-400 pb-1 uppercase tracking-wider">Normality Indicators</h4>
                          <div className="grid grid-cols-1 sm:grid-cols-3 gap-6">
                            <div className="bg-slate-950/40 p-3 rounded-lg border border-slate-800/60">
                              <span className="text-[10px] text-slate-500 block uppercase font-bold">Unbiased Skewness</span>
                              <span className="text-sm font-bold font-mono text-slate-200 mt-1 block">{statsResult.skewness.toFixed(4)}</span>
                              <span className="text-[9px] text-slate-500 block mt-0.5">Perfect Normal = 0</span>
                            </div>
                            <div className="bg-slate-950/40 p-3 rounded-lg border border-slate-800/60">
                              <span className="text-[10px] text-slate-500 block uppercase font-bold">Excess Kurtosis</span>
                              <span className="text-sm font-bold font-mono text-slate-200 mt-1 block">{statsResult.kurtosis.toFixed(4)}</span>
                              <span className="text-[9px] text-slate-500 block mt-0.5">Perfect Normal = 0</span>
                            </div>
                            <div className="bg-slate-950/40 p-3 rounded-lg border border-slate-800/60">
                              <span className="text-[10px] text-slate-500 block uppercase font-bold">Anderson-Darling A*² (p-val)</span>
                              <span className="text-sm font-bold font-mono text-slate-200 mt-1 block">{statsResult.adStatAdj.toFixed(3)} ({statsResult.adPValue.toFixed(4)})</span>
                              <span className="text-[9px] text-slate-500 block mt-0.5">Null H₀: Distribution is Normal</span>
                            </div>
                          </div>
                        </div>

                      </div>
                    )}

                    {activeTab === 'raw' && (
                      <div className="p-6">
                        <div className="overflow-x-auto">
                          <table className="w-full text-left text-xs font-sans">
                            <thead>
                              <tr className="border-b border-slate-800 text-slate-400 font-bold uppercase tracking-wider">
                                <th className="py-2.5 px-4 text-center">Sorted Rank</th>
                                <th className="py-2.5 px-4 text-center">Value (x)</th>
                                <th className="py-2.5 px-4 text-center">Z-Score</th>
                                <th className="py-2.5 px-4 text-center">Empirical Cumulative %</th>
                                <th className="py-2.5 px-4 text-center">Theoretical Quantile</th>
                              </tr>
                            </thead>
                            <tbody className="font-mono text-slate-300 divide-y divide-slate-800/45">
                              {qqChart && qqChart.points.slice(0, 15).map((pt, i) => {
                                const z = (pt.val - statsResult.mean) / statsResult.stdDev;
                                const percentile = ((pt.idx - 0.375) / (currentData.length + 0.25)) * 100;
                                return (
                                  <tr key={i} className="hover:bg-slate-800/30 transition-all">
                                    <td className="py-2 px-4 text-center text-slate-500 font-bold">#{pt.idx}</td>
                                    <td className="py-2 px-4 text-center text-white font-semibold">{pt.val.toFixed(4)}</td>
                                    <td className="py-2 px-4 text-center">{z >= 0 ? `+${z.toFixed(3)}` : z.toFixed(3)}</td>
                                    <td className="py-2 px-4 text-center text-indigo-300">{percentile.toFixed(1)}%</td>
                                    <td className="py-2 px-4 text-center">{pt.q.toFixed(3)}</td>
                                  </tr>
                                );
                              })}
                            </tbody>
                          </table>
                        </div>
                        {currentData.length > 15 && (
                          <p className="text-[10px] text-slate-500 mt-3 text-center leading-relaxed">
                            Showing first 15 of {currentData.length} records. Toggle raw inputs above to review other points.
                          </p>
                        )}
                      </div>
                    )}

                  </div>
                </>
              )}

            </section>

          </main>

          {/* FOOTER */}
          <footer className="border-t border-slate-800 bg-slate-900/60 py-4 px-6 mt-12 text-center text-xs text-slate-500">
            <div className="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3">
              <p>© 2026 SPC-Pro Manufacturing Suite. Real-time Process Capability Analysis.</p>
              <div className="flex gap-4">
                <span className="hover:text-slate-400 cursor-pointer">Quality Manual</span>
                <span className="hover:text-slate-400 cursor-pointer">Normality Standards</span>
                <span className="hover:text-slate-400 cursor-pointer">Export CSV</span>
              </div>
            </div>
          </footer>

          {/* TOAST NOTIFICATION */}
          {toastMessage && (
            <div className="fixed bottom-6 right-6 bg-indigo-600 text-white font-semibold text-xs px-4 py-3 rounded-xl shadow-xl shadow-indigo-500/20 ring-1 ring-indigo-400/30 z-50 animate-bounce">
              {toastMessage}
            </div>
          )}

        </div>
      );
    }

    // Mount Application to Root DOM Element
    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
